name: GitHub Pages

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    - cron: '0 9 * * 1'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Checkout Google Fonts
        uses: actions/checkout@v7
        with:
          repository: google/fonts
          path: data/google/fonts

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Create figures
        run: uv run google_fonts_analysis

      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: output

      - name: Archive output
        run: zip -r output.zip output/

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create v${{ github.run_number }} output.zip \
            --target "${{ github.sha }}" \
            --title "v${{ github.run_number }}" \
            --generate-notes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        uses: actions/deploy-pages@v5
