[build-system]
requires = ["maturin>=1.14,<2.0"]
build-backend = "maturin"

[project]
name = "google-fonts-heatmap"
description = "Heatmap of Google Fonts"
readme = "README.md"
requires-python = ">=3.13"
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
    "Programming Language :: Python :: Implementation :: PyPy",
]
dynamic = ["version"]
dependencies = [
    "matplotlib>=3.10.5",
    "numpy>=2.3.1",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ruff>=0.12.4",
    "maturin>=1.14",
]

[tool.maturin]
module-name = "google_fonts_heatmap._skrifa"
exclude = [
    "**/__pycache__",
    "**/*.pyc",
    "**/*.pyo",
]

[tool.ruff]
unsafe-fixes = true

[tool.ruff.lint]
select = ["ALL"]
ignore = ["D", "T", "EXE"]

[tool.ruff.lint.per-file-ignores]
"google_fonts_heatmap/outline_len_histplot.py" = ["N802", "ARG002"]
"google_fonts_heatmap/outline_coord_jointplot.py" = ["N802"]
"google_fonts_heatmap/outline_len_path_jointplot.py" = ["N802"]
